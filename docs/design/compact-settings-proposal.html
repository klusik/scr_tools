<style>
#scr-design-preview {

  --scr-surface: light-dark(#f7f8fa, #202329);
  --scr-chrome: light-dark(#eef0f3, #272b32);
  --scr-text: light-dark(#242c38, #e5e9ef);
  --scr-muted: light-dark(#657080, #a8b2bf);
  --scr-field: light-dark(#ffffff, #30353d);
  --scr-line: light-dark(#dce1e8, #3b424c);
  --scr-accent: light-dark(#426b91, #8aafcf);
  --scr-tint: light-dark(#e6edf4, #303f4d);
  --scr-shadow: light-dark(#182c4214, #00000030);
  font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
  color: var(--scr-text);
}
#scr-design-preview .scr-stage {
  min-height: 550px;
  padding: 48px 14px 24px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
#scr-design-preview .scr-window {
  --scr-radius: 8px;
  --scr-gap: 12px;
  width: 100%;
  max-width: 530px;
  background: var(--scr-surface);
  border: 1px solid var(--scr-line);
  border-radius: var(--scr-radius);
  box-shadow: 0 8px 28px var(--scr-shadow);
  overflow: clip;
  text-align: left;
}
#scr-design-preview .scr-window.scr-expanded { max-width: 100%; }
#scr-design-preview .scr-window *,
#scr-design-preview .scr-window *::before,
#scr-design-preview .scr-window *::after { box-sizing: border-box; }
#scr-design-preview [hidden] { display: none !important; }
#scr-design-preview button,
#scr-design-preview input,
#scr-design-preview select { font: inherit; color: inherit; }
#scr-design-preview button {
  min-width: 28px;
  min-height: 28px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 5px 8px;
}
#scr-design-preview button:hover { background: var(--scr-tint); }
#scr-design-preview :is(button, input, select, summary):focus-visible {
  outline: 2px solid var(--scr-accent);
  outline-offset: 3px;
}
#scr-design-preview .scr-titlebar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px 5px 12px;
  background: var(--scr-chrome);
}
#scr-design-preview .scr-titlebar > span:first-of-type {
  font-weight: 500;
  flex: 1;
}
#scr-design-preview .scr-version {
  font-size: 12px;
  color: var(--scr-muted);
  padding-right: 5px;
}
#scr-design-preview .scr-layout { display: grid; }
#scr-design-preview .scr-nav {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 9px 15px;

}
#scr-design-preview .scr-nav button {

  padding: 7px 12px;
  min-height: 32px;
}
#scr-design-preview .scr-nav button[aria-selected="true"] {

}
#scr-design-preview .scr-nav .scr-nav-label { display: none; }
#scr-design-preview .scr-window.scr-labels .scr-nav-label { display: inline; }
#scr-design-preview .scr-rail .scr-layout { grid-template-columns: 55px minmax(0, 1fr); }
#scr-design-preview .scr-rail .scr-nav {

}

<script>
(() => {
  const root = document.getElementById('scr-design-preview');
  const template = document.getElementById('scr-window-template');
  const demos = [];
  const restored = window.openai?.widgetState?.modelContent?.settings || {};

  /** Return the chosen tab and its associated panel without changing values. */
  function selectTab(demo, name) {
    demo.shell.querySelectorAll('[data-tab]').forEach(button => {
      button.setAttribute('aria-selected', String(button.dataset.tab === name));
    });
    demo.shell.querySelectorAll('[data-panel]').forEach(panel => {
      panel.hidden = panel.dataset.panel !== name;
    });
  }

  /** Save only synthetic preview choices, without persisting reveal state. */
  function remember() {
    const settings = {};
    demos.forEach(demo => {
      settings[demo.name] = { mode: demo.mode, startup: demo.shell.querySelector('[data-setting="startup"]').checked, minimized: demo.shell.querySelector('[data-setting="minimized"]').checked };
    });
    window.openai?.setWidgetState?.({ modelContent: { settings }, privateContent: null }).catch(() => {});
  }

  /** Apply a compatible saved choice while retaining current transient state. */
  function applySaved(demo, saved) {
    if (!saved || typeof saved !== 'object') return;
    if (['all', 'current', 'each'].includes(saved.mode)) {
      demo.mode = saved.mode;
      demo.shell.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === demo.mode)));
    }
    for (const key of ['startup', 'minimized']) {
      if (typeof saved[key] === 'boolean') demo.shell.querySelector(`[data-setting="${key}"]`).checked = saved[key];
    }
  }

  root.querySelectorAll('.scr-window').forEach(shell => {
    shell.append(template.content.cloneNode(true));
    const name = shell.dataset.layout;
    const stage = shell.parentElement;
    const demo = { shell, stage, name, mode: 'all', revealed: false };
    demos.push(demo);
    shell.querySelectorAll('[data-tab]').forEach(button => {
      button.id = `scr-${name}-tab-${button.dataset.tab}`;
      button.setAttribute('aria-controls', `scr-${name}-panel-${button.dataset.tab}`);
    });
    shell.querySelectorAll('[data-panel]').forEach(panel => {
      panel.id = `scr-${name}-panel-${panel.dataset.panel}`;
      panel.setAttribute('aria-labelledby', `scr-${name}-tab-${panel.dataset.panel}`);
    });
    shell.querySelectorAll('[data-help]').forEach((button, index) => {
      const note = button.parentElement.nextElementSibling;
      note.id = `scr-${name}-help-${index}`;
      button.setAttribute('aria-controls', note.id);
    });
    applySaved(demo, restored[name]);

    /** Report a pending form edit without saving preferences. */
    function markChanged() {
      shell.querySelector('[data-save-state]').textContent = 'Unsaved';
      shell.querySelector('[data-status]').textContent = 'Ready';
      remember();
    }

    /** Conceal advanced on every simulated minimize or close action. */
    function hideWindow() {
      demo.revealed = false;
      shell.querySelector('[data-tab="advanced"]').hidden = true;
      selectTab(demo, 'screenshots');
      shell.hidden = true;
      stage.querySelector('.scr-tray').hidden = false;
      stage.querySelector('[data-restore]').focus();
    }

    shell.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button || !shell.contains(button)) return;
      if (button.hasAttribute('data-tab')) selectTab(demo, button.dataset.tab);
      if (button.hasAttribute('data-mode')) {
        demo.mode = button.dataset.mode;
        shell.querySelectorAll('[data-mode]').forEach(choice => choice.setAttribute('aria-pressed', String(choice === button)));
        markChanged();
      }
      if (button.hasAttribute('data-pattern')) {
        shell.querySelectorAll('[data-pattern]').forEach(choice => choice.setAttribute('aria-pressed', String(choice === button)));
        markChanged();
      }
      if (button.hasAttribute('data-shortcut')) {
        button.textContent = button.textContent.includes('F11') ? 'Ctrl + Shift + F10' : 'Ctrl + Shift + F11';
        markChanged();
      }
      if (button.hasAttribute('data-browse')) {
        const folder = shell.querySelector('[data-folder]');
        folder.textContent = folder.textContent.startsWith('Pictures') ? 'Custom / Captures' : 'Pictures / SCR Tools';
        markChanged();
      }
      if (button.hasAttribute('data-help')) {
        const note = document.getElementById(button.getAttribute('aria-controls'));
        note.hidden = !note.hidden;
        button.setAttribute('aria-expanded', String(!note.hidden));
      }
      if (button.hasAttribute('data-hide')) hideWindow();
      if (button.hasAttribute('data-maximize')) shell.classList.toggle('scr-expanded');
      if (button.hasAttribute('data-apply')) {
        shell.querySelector('[data-save-state]').textContent = 'Saved';
        shell.querySelector('[data-status]').textContent = 'Settings applied';
        remember();
      }
      if (button.hasAttribute('data-capture')) shell.querySelector('[data-status]').textContent = 'Preview · SCRTools_example.png';
      if (button.hasAttribute('data-test')) shell.querySelector('[data-advanced-result]').textContent = 'Preview cycle completed';
    });
    shell.addEventListener('change', event => {
      if (event.target.matches('[data-setting="sleep"]')) {
        shell.querySelector('[data-setting="display"]').disabled = !event.target.checked;
      }
      markChanged();
    });
    shell.addEventListener('keydown', event => {
      if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === 's') {
        event.preventDefault();
        event.stopPropagation();
        demo.revealed = true;
        shell.querySelector('[data-tab="advanced"]').hidden = false;
        selectTab(demo, 'advanced');
      }
      if (event.key === 'Escape') {
        shell.querySelectorAll('[data-help]').forEach(button => button.setAttribute('aria-expanded', 'false'));
        shell.querySelectorAll('.scr-help-text').forEach(note => { note.hidden = true; });
      }
      if (event.altKey && event.key === 'F4') { event.preventDefault(); hideWindow(); }
    });
    stage.querySelector('[data-restore]').addEventListener('click', () => {
      stage.querySelector('.scr-tray').hidden = true;
      shell.hidden = false;
      shell.querySelector('[data-tab="screenshots"]').focus();
    });
    const appearance = { radius: 8, spacing: 12, labels: false };
    /** Reflect optional host design controls without replacing the prototype. */
    function renderAppearance() {
      shell.style.setProperty('--scr-radius', `${appearance.radius}px`);
      shell.style.setProperty('--scr-gap', `${appearance.spacing}px`);
      shell.classList.toggle('scr-labels', appearance.labels);
    }
    renderAppearance();
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: shell, onChange: renderAppearance });
      tweak.addSlider(appearance, 'spacing', { label: 'Rozestupy řádků', min: 6, max: 18, unit: 'px' });
      tweak.addSlider(appearance, 'radius', { label: 'Zaoblení okna', min: 4, max: 12, unit: 'px' });
      tweak.addToggle(appearance, 'labels', { label: 'Popisky navigace' });
    }
  });
  document.addEventListener('click', event => {
    demos.forEach(demo => {
      demo.shell.querySelectorAll('[data-help]').forEach(button => {
        const note = document.getElementById(button.getAttribute('aria-controls'));
        if (!button.contains(event.target) && !note.contains(event.target)) {
          note.hidden = true;
          button.setAttribute('aria-expanded', 'false');
        }
      });
    });
  });
  window.addEventListener('openai:set_globals', event => {
    const settings = event.detail?.globals?.widgetState?.modelContent?.settings;
    if (settings) demos.forEach(demo => applySaved(demo, settings[demo.name]));
  });
  if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
})();
</script>
